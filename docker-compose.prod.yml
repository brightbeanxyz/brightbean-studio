# Production override. Use with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Adds Caddy (auto-HTTPS) in front, and closes the two host ports the dev
# base file publishes — Gunicorn and Postgres must not be reachable from
# the internet directly. APP_DOMAIN and POSTGRES_PASSWORD come from .env.

services:
  migrate:
    image: brightbean-studio:latest
    command: python manage.py migrate --noinput
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
    depends_on:
      postgres:
        condition: service_healthy

  app:
    # 1 vCPU box — 2 workers x 2 threads. Raise with the core count.
    image: brightbean-studio:latest
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 2
    ports: !override []
    volumes:
      - media_data:/app/media
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    image: brightbean-studio:latest
    volumes:
      - media_data:/app/media
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  postgres:
    ports: !override []
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      - APP_DOMAIN=${APP_DOMAIN:?set APP_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
