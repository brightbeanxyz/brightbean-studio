services:
  migrate:
    build: .
    command: python manage.py migrate --noinput
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/brightbean
      - SECRET_KEY=${SECRET_KEY}
      - ENCRYPTION_KEY_SALT=${ENCRYPTION_KEY_SALT}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - APP_URL=${APP_URL}
      - SIGNUP_MODE=${SIGNUP_MODE}
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2
    volumes:
      - media_data:/app/media
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/brightbean
      - SECRET_KEY=${SECRET_KEY}
      - ENCRYPTION_KEY_SALT=${ENCRYPTION_KEY_SALT}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - APP_URL=${APP_URL}
      - SIGNUP_MODE=${SIGNUP_MODE}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build: .
    volumes:
      - media_data:/app/media
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.production
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/brightbean
      - SECRET_KEY=${SECRET_KEY}
      - ENCRYPTION_KEY_SALT=${ENCRYPTION_KEY_SALT}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - APP_URL=${APP_URL}
      - SIGNUP_MODE=${SIGNUP_MODE}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: brightbean
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  media_data:
  postgres_data:
