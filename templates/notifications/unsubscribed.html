{% comment %}Shown after the unsubscribe POST. Standalone for the same reason.{% endcomment %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unsubscribed</title>
</head>
<body style="margin:0;padding:0;background-color:#FAFAF9;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#1C1917;">
  <div style="max-width:480px;margin:0 auto;padding:48px 20px;">
    <div style="background-color:#FFFFFF;border:1px solid #E7E5E4;border-radius:12px;padding:32px;">
      <h1 style="margin:0 0 12px;font-size:20px;font-weight:700;">Done</h1>
      <p style="margin:0;font-size:14px;line-height:1.6;color:#57534E;">
        You'll no longer receive <strong>{{ label }}</strong> emails. They'll still appear in the
        app, and you can turn them back on under Notification preferences.
      </p>
    </div>
  </div>
</body>
</html>
