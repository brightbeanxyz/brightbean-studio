{% extends "layouts/workspace_settings.html" %}
{% block title %}Generate content - {{ brand.name }}{% endblock %}
{% block content %}<div class="max-w-2xl"><h2 class="text-xl font-semibold mb-6">Generate content for {{ brand.name }}</h2><form method="post" class="rounded-xl p-6 space-y-5" style="border:1px solid var(--border);background:var(--surface-0);">{% csrf_token %}<label class="block text-sm font-semibold">Provider<select name="provider" class="form-input w-full" required>{% for value,label in providers %}<option value="{{ value }}">{{ label }}</option>{% endfor %}</select></label><label class="block text-sm font-semibold">Model<input name="model" class="form-input w-full"></label><label class="block text-sm font-semibold">Platform<select name="platform" class="form-input w-full"><option value="linkedin">LinkedIn</option><option value="instagram">Instagram</option></select></label><label class="block text-sm font-semibold">Content type<input name="content_type" value="post" class="form-input w-full"></label><label class="block text-sm font-semibold">Audience<input name="audience" class="form-input w-full"></label><label class="block text-sm font-semibold">Instruction<textarea name="instruction" rows="5" class="form-input w-full"></textarea></label><p class="text-sm">Stored as a draft; never scheduled or published automatically.</p><button class="px-5 py-2 rounded-full" style="background:var(--primary);color:white;">Generate draft</button></form></div>{% endblock %}
